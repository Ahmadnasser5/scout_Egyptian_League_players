function about(){const R=D.results;$('#app').innerHTML=`<h1>${t('about')}</h1><div class="card"><p><b>Data.</b> FotMob, Egyptian Premier League ${M.season}, ${M.matchdays_played} matchdays; ${M.n_players} outfield players with ≥ ${M.min_minutes} minutes (goalkeepers excluded).</p>
 <p><b>Impact index.</b> Each player is compared only with players of the same role: the average percentile on the five per-90 stats that define the role. It is a transparent heuristic, not a validated talent score.</p>
 <p><b>Roles.</b> K-Means (k=4) on 17 standardised per-90 features, named from the cluster profiles. They are inferred styles, not official positions (silhouette 0.14: styles form a continuum).</p>
 <p><b>Style twins.</b> Euclidean distance on the same features; only distances below ${M.close_threshold} (5th percentile of all pairs; median ${M.median_distance}) count as a close match.</p>
 <p><b>Stats-implied rating.</b> Ridge regression predicting FotMob rating from 20 statistics, validated by leaving one whole team out (R² 0.58, error ≈ ${M.rating_rmse}). The gap is shown relative to teammates because ~31% of it is a team effect.</p>
 <p><b>Deep learning.</b> A PyTorch MLP did not beat Ridge (R² ${R.mlp}), and an autoencoder only tied PCA: with 225 players and near-linear relations, the simple model wins.</p>
 <p class="mut"><b>Limits.</b> Only ${M.matchdays_played} matches; no official positions; rating gaps are indicators, not talent; ranks 2–5 of twin lists are fragile.</p></div>`}

 $('#nav').innerHTML=[['#/','ex'],['#/map','map'],['#/about','about']].map(([u,k])=>`<a href="${u}" class="${h==u||(u=='#/'&&parts[1]=='p')?'on':''}">${t(k)}</a>`).join('');$('#lang').textContent=L==='ar'?'EN':'عربي';
 $('#foot').innerHTML=t('snap')(M);window.scrollTo(0,0);parts[1]=='p'?player(parts[2]):h=='#/map'?mapv():h=='#/about'?about():explorer()}
$('#lang').onclick=()=>{L=L==='ar'?'en':'ar';route()};addEventListener('hashchange',route);route();
</script></body></html>
